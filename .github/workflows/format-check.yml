name: Format Check

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install PSScriptAnalyzer
        shell: pwsh
        run: Install-Module -Name PSScriptAnalyzer -Force -Scope CurrentUser

      - name: Check formatting
        shell: pwsh
        run: |
          $files = Get-ChildItem -Path . -Recurse -Include *.ps1, *.psm1
          $issues = @()
          foreach ($file in $files) {
            $raw = Get-Content -Path $file.FullName -Raw
            $formatted = Invoke-Formatter -ScriptDefinition $raw
            if ($raw -ne $formatted) {
              $issues += $file.FullName
            }
          }
          if ($issues.Count -gt 0) {
            Write-Host "The following files are not formatted per PSScriptAnalyzer defaults:"
            $issues | ForEach-Object { Write-Host " - $_" }
            exit 1
          } else {
            Write-Host "All files are correctly formatted."
          }
