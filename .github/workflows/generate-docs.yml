name: Generate Documentation

on:
  push:
    branches: [ main ]
    paths:
      - "Scripts/**"
      - "Modules/**"

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install platyPS
        shell: pwsh
        run: Install-Module -Name platyPS -Force -Scope CurrentUser

      - name: Generate markdown help
        shell: pwsh
        run: |
          New-Item -Path "./Docs/Generated" -ItemType Directory -Force | Out-Null
          Get-ChildItem -Path "./Scripts" -Filter *.ps1 | ForEach-Object {
            $help = Get-Help $_.FullName -Full
            $outFile = "./Docs/Generated/$($_.BaseName).md"
            "# $($_.BaseName)`n`n$($help.Synopsis)`n`n$($help.description.Text -join "`n")" | Out-File -FilePath $outFile -Encoding utf8
          }

      - name: Commit generated docs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Docs/Generated
          git diff --cached --quiet || git commit -m "docs: auto-generate script help [skip ci]"
          git push
